[package]
name = "rfsync"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.40", features = ["derive"] }
walkdir = "2"
blake3="1.8.2"
rayon="1.10.0"
fs_extra="1.3.0"
chrono = { version = "0.4", features = ["clock"] }
indicatif = "0.15.0"
lazy_static="1.5.0"
ssh2="0.9.5"
notify = "6"
globset = "0.4.21"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
rpassword = "7.5.4"

[dev-dependencies]
tempfile = "3.27.0"
